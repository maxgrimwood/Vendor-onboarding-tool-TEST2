            const [captchaStatus, setCaptchaStatus] = useState('idle');

            useEffect(() => {
                const handleClickOutside = (event) => {
                    if (countryRef.current && !countryRef.current.contains(event.target)) {
                        setShowCountryDropdown(false);
                    }
                };
                document.addEventListener("mousedown", handleClickOutside);
                return () => document.removeEventListener("mousedown", handleClickOutside);
            }, []);

            const validateIBAN = (input) => {
                const iban = input.toUpperCase().replace(/[^A-Z0-9]/g, '');
                if (!iban) return true;
                if (!/^([A-Z]{2}[0-9]{2})([A-Z0-9]{11,30})$/.test(iban)) return false;
                const moved = iban.substring(4) + iban.substring(0, 4);
                const converted = moved.split('').map(c => {
                    const code = c.charCodeAt(0);
                    return code >= 65 && code <= 90 ? code - 55 : c;
                }).join('');
                
                let remainder = converted.slice(0, 2);
                for (let offset = 2; offset < converted.length; offset += 7) {
                    let fragment = String(remainder) + converted.substring(offset, offset + 7);
                    remainder = parseInt(fragment, 10) % 97;
                }
                return remainder === 1;
            };

            const validateVAT = (input) => {
                const vat = input.toUpperCase().replace(/[^A-Z0-9]/g, '');
                if (!vat) return true;
                return /^[A-Z]{2}[A-Z0-9]{2,12}$/.test(vat);
            };

            const validateURL = (url) => {
                if (!url) return true;
                return /^((https?:\/\/)?([\w\d\-]+\.)+\w{2,}(\/.*)?)$/i.test(url);
            };

            const handleBlur = (e) => {
                const { name, value } = e.target;
                if (name === 'iban') {
                    if (!value) {
                        setIbanError("");
                        setIsIbanValid(false);
                        return;
                    }
                    const isValid = validateIBAN(value);
                    setIbanError(isValid ? "" : "Invalid IBAN format.");
                    setIsIbanValid(!!isValid);
                } else if (name === 'vatNumber') {
                    const isValid = value && validateVAT(value);
                    setVatError(value && !isValid ? "Invalid EU VAT format." : "");
                    setIsVatValid(!!isValid);
                } else if (name === 'website') {
                    const isValid = value && validateURL(value);
                    setWebsiteError(value && !isValid ? "Invalid URL format." : "");
                    setIsWebsiteValid(!!isValid);
                }
            };

            const getCoordinates = (e) => {
                if (!canvasRef.current) return;
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return { x: clientX - rect.left, y: clientY - rect.top };
            };

            const startDrawing = (e) => {
                e.preventDefault();
                const coords = getCoordinates(e);
                if (!coords) return;
                setIsDrawing(true);
                const ctx = canvasRef.current.getContext('2d');
                ctx.beginPath();
                ctx.moveTo(coords.x, coords.y);
            };

            const draw = (e) => {
                e.preventDefault();
                if (!isDrawing) return;
                const coords = getCoordinates(e);
                if (!coords) return;
                const ctx = canvasRef.current.getContext('2d');
                ctx.lineTo(coords.x, coords.y);
                ctx.strokeStyle = '#0f172a';
                ctx.lineWidth = 3;
                ctx.lineCap = "round";
                ctx.stroke();
            };

            const stopDrawing = () => {
                if (isDrawing) {
                    setIsDrawing(false);
                    setSignaturePreview(canvasRef.current.toDataURL('image/png'));
                }
            };

            const clearSignature = () => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                setSignaturePreview(null);
                if (signatureFileRef.current) {
                    signatureFileRef.current.value = "";
                }
            };

            const handleSignatureUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = canvasRef.current;
                        const ctx = canvas.getContext('2d');
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        const scale = Math.min(canvas.width / img.width, canvas.height / img.height);
                        const x = (canvas.width / 2) - (img.width / 2) * scale;
                        const y = (canvas.height / 2) - (img.height / 2) * scale;
                        ctx.drawImage(img, x, y, img.width * scale, img.height * scale);
                        setSignaturePreview(canvas.toDataURL('image/png'));
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            };

                setCaptchaStatus('loading');
                setTimeout(() => setCaptchaStatus('success'), 800);
            };
